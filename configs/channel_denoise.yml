data:
    dataset: "ChannelDenoise"
    image_size: 64
    channels: 2
    channel_data: true          # disables image-specific rescaling and [0,1] clamp
    d_min: -3.03529787          # CLEAN stats = model training space (used for denorm + metrics)
    d_max:  3.23488426
    n_min: -4.97337484          # noisy stats — informational only (raw inputs)
    n_max:  4.62419653
    inputs_prenormalized: false # samples are RAW physical values
    clean_path: "channel_denoise/clean"   # ground-truth dir under exp/datasets/
    sigma_y: 0.102112          # noise level in the [-1,1] clean scale; set via scripts/estimate_sigma.py (true measured value)
    logit_transform: false
    uniform_dequantization: false
    gaussian_dequantization: false
    random_flip: false
    rescaled: false             # data already mapped to [-1, 1] by the dataset; do NOT apply 2x-1
    num_workers: 0

model:
    type: "openai"
    model_path: "exp/logs/channel_rician/model.pt"   # the Rician (clean-trained) checkpoint
    image_size: 64
    in_channels: 2
    num_channels: 128
    num_res_blocks: 3
    attention_resolutions: "16,8"
    num_heads: 4
    num_head_channels: -1
    num_heads_upsample: -1
    use_scale_shift_norm: true
    dropout: 0.0
    class_cond: false
    use_checkpoint: false
    learn_sigma: true
    use_fp16: false
    resblock_updown: false
    use_new_attention_order: false
    channel_mult: ""
    var_type: fixedsmall

diffusion:
    beta_schedule: cosine       # MUST match training (--noise_schedule cosine); checkpoint is a cosine model
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000

sampling:
    batch_size: 1

time_travel:
    T_sampling: 100
    travel_length: 1
    travel_repeat: 1